# ─────────────────────────────────────────────────────────────
#  LOADOUT — skills.
#  `attributes` draws the hexagon radar chart (use 3–8 entries).
#  `value` (0–100) only sets how far each point reaches, i.e. your relative
#  focus between areas. It is never displayed as a number.
#  `loadout` is the grouped equipment grid. Tool names that match a
#  Simple Icons title (https://simpleicons.org) get their logo automatically.
# ─────────────────────────────────────────────────────────────

attributes:
  - name: AI agents & LLM systems
    value: 80
  - name: Backend & distributed systems
    value: 99
  - name: Infrastructure & DevOps
    value: 65
  - name: Data & databases
    value: 87
  - name: Frontend & product UI
    value: 50
  - name: Computer vision & research
    value: 87

loadout:
  - slot: Languages
    items: [Python, Go, TypeScript, C++]
  - slot: AI & agents
    items: [CrewAI, LangGraph, LangChain, TensorFlow, OpenTelemetry]
  - slot: Backend & data
    items: [PostgreSQL, Redis, RabbitMQ, SQLite, FastAPI, Django, Express]
  - slot: Frontend
    items: [React, htmx, Alpine.js, Templ, Tailwind CSS]
  - slot: Infrastructure
    items: [Docker, AWS KMS, Node.js, Vercel]
