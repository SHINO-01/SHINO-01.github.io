# ─────────────────────────────────────────────────────────────
#  PROJECTS — shown as collectible cards in a horizontal scroller.
#  Order here = order on the site.
#
#  rank:   S | A | B          (card rarity frame)
#  color:  volt | ether | hazard | cyan   (card accent)
#  glyph:  1–3 characters printed huge on the card art
#  year:   optional, shown on the card
#  image:  optional screenshot in /public (e.g. projects/tellproof.webp);
#          without one, the card generates its own artwork.
